packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  '@eslint/js': ^9.39.5
  '@types/node': ^24.10.1
  dotenv-cli: ^11.0.0
  eslint: ^9.39.5
  prettier: ^3.7.3
  prisma-extension-kysely: ^3.0.0
  prisma-kysely: ^2.3.0
  react-aria-components: 1.14.0
  react-hook-form: ^7.68.0
  '@hookform/resolvers': '^5.2.2'
  typescript: ^5.9.3
  zod: ^4.1.13

catalogs:
  oui:
    '@opengovsg/oui': 0.0.62
    '@opengovsg/oui-theme': 0.0.62
  prisma:
    '@prisma/adapter-pg': ^7.10.0
    '@prisma/client': ^7.10.0
    '@prisma/client-runtime-utils': 7.10.0
    prisma: ^7.10.0
  next:
    '@next/env': 16.3.6
    '@next/eslint-plugin-next': 16.3.6
    next: 16.3.6
  react:
    '@types/react': ^19.2.7
    '@types/react-dom': ^19.2.3
    react: ^19.2.3
    react-dom: ^19.2.3
  react-query5:
    '@tanstack/react-query': ^5.90.11
    '@tanstack/react-query-devtools': ^5.91.1
  storybook10:
    '@storybook/addon-a11y': ^10.6.0
    '@storybook/addon-docs': ^10.6.0
    '@storybook/addon-vitest': ^10.6.0
    '@storybook/nextjs-vite': ^10.6.0
    eslint-plugin-storybook: ^10.6.0
    storybook: ^10.6.0
    storybook-addon-vite-mock: ^1.1.4
  t3-env:
    '@t3-oss/env-core': ^0.13.11
    '@t3-oss/env-nextjs': ^0.13.11
  tailwindcss4:
    '@tailwindcss/postcss': ^4.3.3
    tailwindcss: ^4.3.3
  trpc:
    '@trpc/client': ^11.19.0
    '@trpc/server': ^11.19.0
    '@trpc/tanstack-react-query': ^11.19.0
  vitest:
    '@vitest/browser': 4.1.11
    '@vitest/browser-playwright': 4.1.11
    '@vitest/coverage-v8': 4.1.11
    vitest: 4.1.11

linkWorkspacePackages: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - next
  - '@next/env'
  - '@next/eslint-plugin-next'
  - react
  - react-dom
  - '@opengovsg/*'
  - storybook
  - '@storybook/*'
  - eslint-plugin-storybook

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma

overrides:
  '@types/minimatch': 5.1.2
  '@babel/core': '>=7.29.6'
  '@grpc/grpc-js': '>=1.14.4'
  '@humanfs/node': '>=0.16.8'
  '@protobufjs/utf8': '>=1.1.1'
  'ajv@8': '>=8.18.0'
  'baseline-browser-mapping': '>=2.11.0'
  'body-parser': '>=2.3.0'
  'brace-expansion@1': '>=1.1.18'
  'brace-expansion@2': '>=2.1.4'
  browserslist: '>=4.28.7'
  'deepmerge-ts': '>=8.0.0'
  defu: '>=6.1.5'
  effect: '>=3.20.0'
  'fast-uri': '>=3.1.6'
  flatted: '>=3.4.2'
  'js-yaml': '>=4.3.2'
  'lodash@4': '>=4.18.0'
  'minimatch@3': '>=3.1.4'
  'minimatch@5': '>=5.1.8'
  'minimatch@9': '>=9.0.7'
  mysql2: '>=3.23.1'
  'path-to-regexp@8': '>=8.4.0'
  picomatch: '>=4.0.4'
  protobufjs: '>=7.6.5'
  qs: '>=6.16.0'
  rollup: '>=4.59.0'
  tmp: '>=0.2.6'
  uuid: '>=11.1.1'
  'yaml@2': '>=2.8.3'

patchedDependencies:
  '@prisma/client': patches/@prisma__client.patch
  prisma-extension-kysely@3.0.0: patches/prisma-extension-kysely@3.0.0.patch

publicHoistPattern:
  - '*prettier*'
  - '*eslint-plugin*'
  - '*@opengovsg/oui*'
  - '*prisma*'
  - pg
